<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  <link rel="stylesheet" href="/styles/colors.css">
  <title>Registro</title>
  <style>
    input::placeholder {
      color: #aaa !important;
      opacity: 1;
    }
  </style>
</head>
<body class="d-grid bg-brand-extralight min-vh-100 py-4" style="place-content:center;">
  <form class="d-flex flex-column bg-white gap-3 container border p-4 rounded shadow-lg" action="#" th:action="@{/registro}" th:object="${usuario}" method="POST">
    <div class="row g-4">
      <div class="col-12 col-md-6">
        <label class="form-label" for="nombre">*Nombre</label>
        <input class="form-control" type="text" id="nombre" name="nombre" placeholder="Juan" required>
      </div>
      
      <div class="col-12 col-md-6">
        <label class="form-label" for="apellido">Apellido</label>
        <input class="form-control" type="text" id="apellido" name="apellido" placeholder="Pérez">
      </div>
    </div>
    <div>
      <label class="form-label" for="dni">DNI</label>
      <input class="form-control" type="text" id="dni" name="dni" placeholder="12345678A">
    </div>
    <div>
      <label class="form-label" for="email">*Email</label>
      <input class="form-control" type="email" id="email" name="email" placeholder="ejemplo@correo.com" required>
    </div>
    <div>
      <label class="form-label" for="username">*Nombre de Usuario</label>
      <input class="form-control" type="text" id="username" name="username" placeholder="Elige un nombre de usuario" required>
    </div>
    <div class="d-flex flex-column gap-2 mt-2">
      <div>
        <label class="form-label" for="password">*Contraseña</label>
        <input class="form-control" type="password" id="password" name="password" placeholder="Crea una contraseña segura" required>
      </div>
      <div>
        <label class="form-label" for="confirmPassword">*Confirmar Contraseña</label>
        <input class="form-control" type="password" id="confirmPassword" name="confirmPassword" placeholder="Confirma tu contraseña" required>
      </div>
    </div>
    
  <div th:replace="~{fragments/footer :: pie}"></div>
  
  <script>
    const form = document.querySelector('form');
    const passwordInput = document.getElementById('password');
    const confirmPasswordInput = document.getElementById('confirmPassword');

    form.addEventListener('submit', function(event) {
      if (passwordInput.value !== confirmPasswordInput.value) {
        event.preventDefault();
        alert('Las contraseñas no coinciden. Por favor, inténtalo de nuevo.');
      }
    });
  </script>
</body>
</html>
