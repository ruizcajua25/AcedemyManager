<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  <link rel="stylesheet" href="/styles/colors.css">
  <title>Registro</title>
  <style>
    input::placeholder {
      color: #aaa !important;
      opacity: 1;
    }
  </style>
</head>
<body class="bg-brand-dark text-white d-flex flex-column min-vh-100">
  <nav th:replace="~{fragments/navbar :: navbar-nofixed}"></nav>

  <main class="container flex-grow-1 d-flex align-items-center py-5">
    <div class="row w-100 justify-content-center">
      <div class="col-12 col-lg-10 col-xl-8">
        <div class="row align-items-center">
          <div class="col-12 col-md-5 mb-4 mb-md-0">
            <h1 class="text-brand-light text-uppercase fw-semibold display-4">
              Crea tu
              <span class="d-block">cuenta</span>
            </h1>
            <p class="lead text-white-50 mt-3">Unete a Academy Manager y empieza a gestionar tus academias de forma profesional.</p>
          </div>
          <div class="col-12 col-md-7">
            <form class="d-flex flex-column bg-white gap-3 p-4 rounded shadow-lg text-dark" action="#" th:action="@{/registro}" th:object="${usuario}" method="POST">
              <div class="row g-3">
                <div class="col-12 col-sm-6">
                  <label class="form-label small fw-semibold" for="nombre">*Nombre</label>
                  <input class="form-control" type="text" id="nombre" name="nombre" placeholder="Juan" required>
                </div>
                
                <div class="col-12 col-sm-6">
                  <label class="form-label small fw-semibold" for="apellido">Apellido</label>
                  <input class="form-control" type="text" id="apellido" name="apellido" placeholder="Perez">
                </div>
              </div>
              
              <div>
                <label class="form-label small fw-semibold" for="dni">DNI</label>
                <input class="form-control" type="text" id="dni" name="dni" placeholder="12345678A"
                       required pattern="[0-9]{8}[A-Z]" maxlength="9">
                <div class="invalid-feedback">DNI invalido. Debe tener 8 digitos y una letra valida.</div>
              </div>
              
              <div>
                <label class="form-label small fw-semibold" for="email">*Email</label>
                <input class="form-control" type="email" id="email" name="email" placeholder="ejemplo@correo.com" required>
              </div>
              
              <div>
                <label class="form-label small fw-semibold" for="username">*Nombre de Usuario</label>
                <input class="form-control" type="text" id="username" name="username" placeholder="Elige un nombre de usuario" required>
              </div>
              
              <div class="row g-3">
                <div class="col-12 col-sm-6">
                  <label class="form-label small fw-semibold" for="password">*Contrasena</label>
                  <input class="form-control" type="password" id="password" name="password" placeholder="Contrasena segura" required>
                </div>
                <div class="col-12 col-sm-6">
                  <label class="form-label small fw-semibold" for="confirmPassword">*Confirmar</label>
                  <input class="form-control" type="password" id="confirmPassword" name="confirmPassword" placeholder="Confirma contrasena" required>
                </div>
              </div>
              
              <button class="btn bg-brand text-white fw-semibold mt-2" type="submit">Registrarse</button>
              
              <p class="text-secondary text-center mt-2 mb-0 small">
                Ya tienes cuenta? <a class="text-brand fw-semibold text-decoration-none" href="/login">Inicia sesion</a>
              </p>
            </form>
          </div>
        </div>
      </div>
    </div>
  </main>

  <div th:replace="~{fragments/footer :: pie}"></div>

</body>
</html>
