<th:block xmlns:th="http://www.thymeleaf.org" th:fragment="navbar">
  <nav class="navbar gap-4 p-4 d-flex justify-content-center">
    <div class="d-flex gap-5" th:unless="${usuario}">
      <a class="nav-link" href="/login">Iniciar sesión</a>
      <a class="nav-link" href="/registro">Registrarse</a>
    </div>
    <div class="d-flex gap-4" th:if="${usuario}">
      <form action="#" th:action="@{/logout}" method="post">
        <button class="nav-link" type="submit">Cerrar sesión</button>
      </form>
    </div>
  </nav>
</th:block>
