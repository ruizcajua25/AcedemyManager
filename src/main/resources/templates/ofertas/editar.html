<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  <link rel="stylesheet" href="/styles/colors.css">
  <title>Editar oferta</title>
  <style>
    input::placeholder,
    textarea::placeholder {
      color: #aaa !important;
      opacity: 1;
    }
    .form-control:user-invalid,
    .form-select:user-invalid {
      border-color: #dc3545;
      box-shadow: 0 0 0 0.25rem rgba(220, 53, 69, 0.15);
    }
    .form-control:user-invalid ~ .invalid-feedback,
    .form-select:user-invalid ~ .invalid-feedback {
      display: block;
    }
  </style>
</head>
<body class="bg-brand-dark text-white d-flex flex-column min-vh-100">
  <nav th:replace="~{fragments/navbar :: navbar-nofixed}"></nav>

  <main class="container flex-grow-1 d-flex align-items-center py-5">
    <div class="row w-100 justify-content-center">
      <div class="col-12 col-lg-10 col-xl-8">
        <div class="row align-items-center">
          <div class="col-12 col-md-5 mb-4 mb-md-0">
            <h1 class="text-brand-light text-uppercase fw-semibold display-4">
              Editar
              <span class="d-block">oferta</span>
            </h1>
            <p class="lead text-white-50 mt-3">Modifica los datos de la oferta.</p>
          </div>
          <div class="col-12 col-md-7">
            <form class="d-flex flex-column bg-white gap-3 p-4 rounded shadow-lg text-dark" action="#" th:action="@{/ofertas/editar(id=${oferta.id})}" th:object="${oferta}" method="POST">
              
              <div>
                <label class="form-label small fw-semibold" for="titulo">*Titulo de la oferta</label>
                <input class="form-control" type="text" id="titulo" name="titulo" th:field="*{titulo}" 
                       required minlength="3" maxlength="100"
                       placeholder="Titulo de la oferta">
                <div class="invalid-feedback">El titulo es obligatorio (minimo 3 caracteres).</div>
              </div>

              <div>
                <label class="form-label small fw-semibold" for="descripcion">Descripcion</label>
                <textarea class="form-control" id="descripcion" name="descripcion" th:field="*{descripcion}" 
                          rows="3" maxlength="500" 
                          placeholder="Descripcion de la oferta..."></textarea>
              </div>

              <div class="row g-3">
                <div class="col-12 col-sm-6">
                  <label class="form-label small fw-semibold" for="tipoOferta">*Tipo de oferta</label>
                  <select class="form-select" name="tipoOferta" th:field="*{tipoOferta}" id="tipoOferta" required>
                    <option value="profesor">Profesor</option>
                    <option value="alumno">Alumno</option>
                    <option value="direccion">Direccion</option>
                  </select>
                </div>
                <div class="col-12 col-sm-6">
                  <label class="form-label small fw-semibold" for="cursoId">Curso</label>
                  <select class="form-select" id="cursoId" name="cursoId" th:value="${oferta.curso != null ? oferta.curso.id : ''}">
                    <option value="">Selecciona un curso</option>
                    <option th:each="curso : ${cursos}" th:value="${curso.id}" th:text="${curso.nombre}" th:selected="${oferta.curso != null and oferta.curso.id == curso.id}"></option>
                  </select>
                </div>
              </div>

              <input type="hidden" th:field="*{academia.id}" />
              
              <div class="d-flex gap-2 mt-2">
                <button class="btn bg-brand text-white fw-semibold" type="submit">Guardar cambios</button>
                <a class="btn btn-outline-secondary" th:href="@{/ofertas/{id}(id=${oferta.id})}">Cancelar</a>
              </div>
            </form>
          </div>
        </div>
      </div>
    </div>
  </main>

  <div th:replace="~{fragments/footer :: pie}"></div>

  <script>
    const tipoOferta = document.getElementById('tipoOferta');
    const cursoId = document.getElementById('cursoId');

    function actualizarCurso() {
      if (tipoOferta.value == 'direccion') {
        cursoId.value = '';
        cursoId.disabled = true;
        cursoId.required = false;
      } else if (tipoOferta.value == 'alumno') {
        cursoId.disabled = false;
        cursoId.required = true;
      } else {
        cursoId.disabled = false;
        cursoId.required = false;
      }
    }

    tipoOferta.addEventListener('change', actualizarCurso);
    actualizarCurso();
  </script>
</body>
</html>
