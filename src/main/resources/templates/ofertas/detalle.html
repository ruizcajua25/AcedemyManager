<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  <link rel="stylesheet" href="/styles/colors.css">
  <title>Oferta</title>
</head>
<body class="bg-brand-dark text-white">
  <nav th:replace="~{fragments/navbar :: navbar-nofixed}"></nav>
  <main class="p-5">
    <div class="d-flex justify-content-between mb-5">
      <div>
        <h1 class="mb-2" style="line-height: 1rem;" th:text="${oferta.titulo}">Titulo de la oferta</h1>
        <div>
          <a class="text-white opacity-50" th:href="@{/academias/{id}(id=${oferta.academia.id})}" th:text="${oferta.academia.nombre}">Academia</a>
        </div>
        <span th:text="${oferta.tipoOferta}" class="badge bg-brand text-capitalize">Oferta</span>
        <form th:if="${!aplicado && !editable && aplicable}" action="#" method="post" th:action="@{/ofertas/aplicar(id=${oferta.id})}" class="mt-3">
          <button type="submit" class="btn btn-outline-primary border-brand-light text-white">Aplicar</button>
        </form>
        <button th:if="${aplicado}" class="d-block btn btn-outline-success border-brand-light text-white mt-3" disabled>Ya has aplicado</button>
        <button th:if="${!aplicable}" class="d-block btn btn-outline-success border-brand-light text-white mt-3" disabled>Oferta no aplicable</button>
      </div>
      <div class="d-flex flex-column gap-1" th:if="${editable}">
        <div class="d-flex justify-content-between">
          <a class="btn btn-outline-success border-brand-light text-white" th:href="@{/ofertas/editar(id=${oferta.id})}">Editar</a>
          <form action="" method="post" th:action="@{/ofertas/borrar(id=${oferta.id})}" style="display:inline;">
            <button id="boton-borrar" type="submit" class="btn btn-outline-danger border-danger text-white">Borrar</button>
          </form>
        </div>
        <a class="btn btn-outline-success border-brand-light text-white" th:href="@{/ofertas/{id}/candidatos(id=${oferta.id})}">
          Ver los candidatos
        </a>
      </div>
    </div>
    <p th:text="${oferta.descripcion}">Descripción de la oferta...</p>
  </main>
  <script>
    document.getElementById('boton-borrar').addEventListener('click', function(event) {
      if (!confirm('¿Estás seguro de que quieres borrar esta oferta?')) {
        event.preventDefault();
      }
    });
  </script>
</body>
</html>
