<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.2/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="/styles/colors.css">
  <title>Oferta</title>
</head>
<body class="bg-brand-dark text-white d-flex flex-column min-vh-100">
  <nav th:replace="~{fragments/navbar :: navbar-nofixed}"></nav>

  <main class="container py-5 flex-grow-1">
    <div class="mb-4">
      <a class="text-brand-light text-decoration-none" th:href="@{/academias/{id}(id=${oferta.academia.id})}">
        <i class="bi bi-arrow-left"></i> <span th:text="${oferta.academia.nombre}">Academia</span>
      </a>
    </div>

    <div class="d-flex flex-column flex-md-row justify-content-between gap-4 mb-5">
      <div>
        <h1 class="display-5 fw-bold mb-2" th:text="${oferta.titulo}">Titulo de la oferta</h1>
        <span th:text="${oferta.tipoOferta}" class="badge bg-brand text-capitalize mb-3">Oferta</span>

        <div class="mt-3">
          <form th:if="${!aplicado && !editable && aplicable}" action="#" method="post" th:action="@{/ofertas/aplicar(id=${oferta.id})}">
            <button type="submit" class="btn bg-brand-light text-dark px-4">Aplicar a esta oferta</button>
          </form>
          <button th:if="${aplicado}" class="btn btn-outline-success border-brand-light text-white" disabled>Ya has aplicado</button>
          <button th:if="${!aplicable}" class="btn btn-outline-secondary text-white-50" disabled>Oferta no aplicable</button>
        </div>
      </div>

      <div class="d-flex flex-column gap-2 align-self-start" th:if="${editable}">
        <div class="d-flex gap-2">
          <a class="btn btn-outline-light btn-sm" th:href="@{/ofertas/editar(id=${oferta.id})}">Editar</a>
          <form action="" method="post" th:action="@{/ofertas/borrar(id=${oferta.id})}">
            <button id="boton-borrar" type="submit" class="btn btn-outline-danger btn-sm">Borrar</button>
          </form>
        </div>
        <a class="btn btn-outline-light btn-sm" th:href="@{/ofertas/{id}/candidatos(id=${oferta.id})}">
          <i class="bi bi-people"></i> Ver los candidatos
        </a>
      </div>
    </div>

    <section class="p-4 rounded border border-secondary border-opacity-25" style="background-color: rgba(255,255,255,0.05);">
      <h2 class="h5 fw-semibold mb-3">Descripcion</h2>
      <p class="lead mb-0" th:text="${oferta.descripcion}">Descripcion de la oferta...</p>
    </section>
  </main>

  <div th:replace="~{fragments/footer :: pie}"></div>

  <script>
    const botonBorrar = document.getElementById('boton-borrar');
    if (botonBorrar) {
      botonBorrar.addEventListener('click', function(event) {
        if (!confirm('Estas seguro de que quieres borrar esta oferta?')) {
          event.preventDefault();
        }
      });
    }
  </script>
</body>
</html>
