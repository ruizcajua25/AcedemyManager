<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  <link rel="stylesheet" href="/styles/colors.css">
  <title>Buscar ofertas</title>
  <style>
    .oferta-card {
      transition: transform .2s ease, box-shadow .2s ease;
    }

    .oferta-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 1rem 2rem rgba(0, 0, 0, .18) !important;
    }
  </style>
  <script defer>
    document.addEventListener('DOMContentLoaded', () => {
      const searchInput = document.getElementById('searchInput');
      const ofertas = document.querySelectorAll('.oferta');

      searchInput.addEventListener('input', () => {
        const filter = searchInput.value.toLowerCase();

        ofertas.forEach(oferta => {
          const text = oferta.textContent.toLowerCase();
          if (text.includes(filter)) {
            oferta.style.display = '';
          } else {
            oferta.style.display = 'none';
          }
        });
      });
    });
  </script>
</head>
<body class="bg-brand-dark text-white min-vh-100">
  <nav th:replace="~{fragments/navbar :: navbar-nofixed}"></nav>

  <main class="container py-5">
    <header class="mb-4">
      <h1 class="display-5 fw-bold mb-2">Buscar ofertas</h1>
      <p class="lead text-white-50 mb-0">Encuentra ofertas abiertas en las academias.</p>
    </header>

    <input class="form-control form-control-lg mb-4" type="text" placeholder="Buscar oferta..." id="searchInput">

    <div th:if="${#lists.size(ofertas) == 0}" class="bg-white text-dark rounded shadow p-5 text-center">
      <h2 class="h3 fw-bold mb-3">No hay ofertas disponibles</h2>
      <p class="text-secondary mb-0">Ahora mismo no hay ofertas activas para mostrar.</p>
    </div>

    <section th:if="${#lists.size(ofertas) > 0}" class="row g-4">
      <div class="oferta col-12 col-md-6 col-xl-4" th:each="oferta : ${ofertas}">
        <a class="text-decoration-none" th:href="@{/ofertas/{id}(id=${oferta.id})}">
          <article class="oferta-card bg-white text-dark rounded shadow-sm p-4 h-100">
            <div class="d-flex justify-content-between gap-3 align-items-start mb-3">
              <h2 class="h5 fw-bold mb-0 text-truncate" th:text="${oferta.titulo}">Titulo de la oferta</h2>
              <span class="badge bg-brand text-white text-capitalize" th:text="${oferta.tipoOferta}">Tipo</span>
            </div>

            <p class="text-secondary mb-3" th:text="${oferta.descripcion}">Descripcion de la oferta</p>

            <div class="border-top pt-3 d-flex flex-column gap-1 small text-secondary">
              <span th:text="${oferta.academia.nombre}">Academia</span>
              <span th:if="${oferta.curso}" th:text="${oferta.curso.nombre}">Curso</span>
              <span th:unless="${oferta.curso}">Sin curso asignado</span>
            </div>
          </article>
        </a>
      </div>
    </section>
  </main>
</body>
</html>
