<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.2/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="/styles/colors.css">
  <title>Candidatos</title>
</head>
<body class="bg-brand-dark text-white d-flex flex-column min-vh-100">
  <nav th:replace="~{fragments/navbar :: navbar-nofixed}"></nav>

  <main class="container py-5 flex-grow-1">
    <div class="mb-4">
      <a class="text-brand-light text-decoration-none" th:href="@{/ofertas/{id}(id=${oferta.id})}">
        <i class="bi bi-arrow-left"></i> Volver a la oferta
      </a>
    </div>

    <header class="mb-4">
      <h1 class="display-5 fw-bold mb-2">Candidatos</h1>
      <p class="lead text-white-50 mb-0">
        Oferta: <span class="text-white fw-semibold" th:text="${oferta.titulo}"></span>
      </p>
    </header>

    <div th:if="${#lists.size(candidatos) == 0}" class="bg-white text-dark rounded shadow p-5 text-center">
      <h2 class="h3 fw-bold mb-3">No hay candidatos</h2>
      <p class="text-secondary mb-0">Todavia nadie ha aplicado a esta oferta.</p>
    </div>

    <div th:if="${#lists.size(candidatos) > 0}" class="row g-3">
      <div class="col-12 col-md-6 col-lg-4" th:each="candidato : ${candidatos}">
        <div class="card h-100 border border-secondary border-opacity-25" style="background-color: rgba(255,255,255,0.05);">
          <div class="card-body d-flex flex-column justify-content-between">
            <div>
              <h5 class="card-title fw-semibold mb-1" th:text="${candidato.nombre}">Nombre</h5>
              <p class="text-white-50 small mb-3" th:text="${candidato.email}">Email</p>
            </div>
            <div class="d-flex gap-2">
              <form action="#" method="post" th:action="@{/ofertas/{id}/aceptar/{candidatoId}(id=${oferta.id}, candidatoId=${candidato.id})}">
                <button class="btn btn-success btn-sm">Aceptar</button>
              </form>
              <form action="#" method="post" th:action="@{/ofertas/{id}/rechazar/{candidatoId}(id=${oferta.id}, candidatoId=${candidato.id})}">
                <button class="btn btn-danger btn-sm">Rechazar</button>
              </form>
            </div>
          </div>
        </div>
      </div>
    </div>
  </main>

  <div th:replace="~{fragments/footer :: pie}"></div>
</body>
</html>
