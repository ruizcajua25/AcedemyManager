<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.2/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="/styles/colors.css">
  <title>Editar Perfil</title>
</head>
<body class="bg-brand-dark text-white min-vh-100 d-flex flex-column">

  <nav th:replace="~{fragments/navbar :: navbar-nofixed}"></nav>

  <main class="container py-5 flex-grow-1">
    <div class="row justify-content-center">
      <div class="col-12 col-lg-8">

        <a class="text-brand-light text-decoration-none small mb-4 d-inline-block" href="/perfil">
          <i class="bi bi-arrow-left"></i> Volver al perfil
        </a>

        <h1 class="display-5 fw-bold text-brand-light mb-5">Editar perfil</h1>

        <form method="post" th:action="@{/perfil/editar}" th:object="${usuario}" class="p-4 rounded border border-secondary border-opacity-25" style="background-color: rgba(255,255,255,0.05);">
          <div class="row g-3">
            <div class="col-12 col-md-6">
              <label class="form-label text-white-50 small">Nombre</label>
              <input type="text" class="form-control bg-transparent text-white" th:field="*{nombre}" required minlength="2" maxlength="100">
            </div>
            <div class="col-12 col-md-6">
              <label class="form-label text-white-50 small">Apellidos</label>
              <input type="text" class="form-control bg-transparent text-white" th:field="*{apellidos}" required minlength="2" maxlength="150">
            </div>
            <div class="col-12 col-md-6">
              <label class="form-label text-white-50 small">DNI</label>
              <input type="text" class="form-control bg-transparent text-white" th:field="*{dni}" pattern="^[0-9]{8}[A-Za-z]$" placeholder="12345678A">
            </div>
            <div class="col-12 col-md-6">
              <label class="form-label text-white-50 small">Email</label>
              <input type="email" class="form-control bg-transparent text-white" th:field="*{email}" required>
            </div>
            <div class="col-12">
              <label class="form-label text-white-50 small">Nueva contraseña <span class="text-white-50">(dejar vacio para no cambiar)</span></label>
              <input type="password" class="form-control bg-transparent text-white" th:field="*{password}">
            </div>
          </div>

          <div class="d-flex gap-3 mt-4">
            <button type="submit" class="btn bg-brand-light text-dark fw-semibold px-4">
              <i class="bi bi-check-lg me-1"></i>Guardar cambios
            </button>
            <a href="/perfil" class="btn btn-outline-light px-4">Cancelar</a>
          </div>
        </form>

      </div>
    </div>
  </main>

  <div th:replace="~{fragments/footer :: pie}"></div>

</body>
</html>
