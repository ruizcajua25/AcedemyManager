<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.2/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="/styles/colors.css">
  <title>Mi Perfil</title>
  <style>
    .stat-box {
      background-color: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 0.75rem;
      transition: transform 0.2s ease, background-color 0.2s ease;
    }
    .stat-box:hover {
      transform: translateY(-2px);
      background-color: rgba(255, 255, 255, 0.08);
    }
    .data-row {
      padding: 0.75rem 0;
      border-bottom: 1px solid rgba(255, 255, 255, 0.06);
    }
    .data-row:last-child {
      border-bottom: none;
    }
  </style>
</head>
<body class="bg-brand-dark text-white min-vh-100 d-flex flex-column">

  <nav th:replace="~{fragments/navbar :: navbar-nofixed}"></nav>

  <main th:if="${usuario}" class="container py-5 flex-grow-1">
    <div class="row justify-content-center">
      <div class="col-12 col-lg-10">
        
        <header class="mb-5 pb-4 border-bottom border-secondary border-opacity-25">
          <div class="d-flex flex-column flex-md-row justify-content-between align-items-md-center gap-4">
            <div>
              <h1 class="display-4 fw-bold text-brand-light mb-2">
                <span th:text="${usuario.nombre}"></span> 
                <span th:text="${usuario.apellidos}"></span>
              </h1>
              <div class="text-white-50 d-flex align-items-center gap-2">
                <i class="bi bi-envelope-fill"></i>
                <span th:text="${usuario.email}"></span>
              </div>
            </div>
            <a href="/perfil/editar" class="btn btn-outline-light fw-semibold px-4 py-2 align-self-start">
              <i class="bi bi-pencil-square me-2"></i>Editar perfil
            </a>
          </div>
        </header>

        <div class="row g-4 mb-5">
          <div class="col-12 col-md-6 col-lg-3">
            <a href="/panel/academias" class="text-decoration-none">
              <div class="stat-box p-3 text-center h-100">
                <i class="bi bi-building display-6 text-brand-light"></i>
                <h3 class="fw-bold mb-1 mt-2" th:text="${totalAcademias}">0</h3>
                <p class="text-white-50 small mb-0">Academias</p>
              </div>
            </a>
          </div>
          <div class="col-12 col-md-6 col-lg-3">
            <div class="stat-box p-3 text-center h-100">
              <i class="bi bi-shield-check display-6 text-success"></i>
              <h3 class="fw-bold mb-1 mt-2" th:text="${totalDirector}">0</h3>
              <p class="text-white-50 small mb-0">Como Director</p>
            </div>
          </div>
          <div class="col-12 col-md-6 col-lg-3">
            <div class="stat-box p-3 text-center h-100">
              <i class="bi bi-person-workspace display-6 text-warning"></i>
              <h3 class="fw-bold mb-1 mt-2" th:text="${totalProfesor}">0</h3>
              <p class="text-white-50 small mb-0">Como Profesor</p>
            </div>
          </div>
          <div class="col-12 col-md-6 col-lg-3">
            <div class="stat-box p-3 text-center h-100">
              <i class="bi bi-mortarboard-fill display-6 text-info"></i>
              <h3 class="fw-bold mb-1 mt-2" th:text="${totalAlumno}">0</h3>
              <p class="text-white-50 small mb-0">Como Alumno</p>
            </div>
          </div>
        </div>

        <div class="row g-4 mb-5">
          <div class="col-12 col-lg-8">
            <div class="p-4 rounded border border-secondary border-opacity-25" style="background-color: rgba(255,255,255,0.05);">
              <h2 class="h5 fw-semibold mb-4 d-flex align-items-center gap-2">
                <i class="bi bi-person-badge-fill text-brand-light"></i> Datos personales
              </h2>
              <div class="data-row">
                <span class="text-white-50 small d-block">DNI</span>
                <span class="fw-semibold" th:text="${usuario.dni}">—</span>
              </div>
              <div class="data-row">
                <span class="text-white-50 small d-block">Nombre completo</span>
                <span class="fw-semibold" th:text="${usuario.nombre + ' ' + usuario.apellidos}">—</span>
              </div>
              <div class="data-row">
                <span class="text-white-50 small d-block">Email</span>
                <span class="fw-semibold" th:text="${usuario.email}">—</span>
              </div>
              <div class="data-row">
                <span class="text-white-50 small d-block">Nombre de usuario</span>
                <span class="fw-semibold" th:text="${usuario.username}">—</span>
              </div>
            </div>
          </div>
        </div>

      </div>
    </div>
  </main>

  <main th:unless="${usuario}" class="container py-5 text-center flex-grow-1">
    <div class="row justify-content-center">
      <div class="col-md-6">
        <div class="p-5 rounded border border-warning border-opacity-50 text-center" style="background-color: rgba(255,193,7,0.1);">
          <i class="bi bi-exclamation-triangle-fill text-warning display-3 d-block mb-3"></i>
          <h4 class="fw-bold text-warning">Usuario no encontrado</h4>
          <p class="text-white-50 mb-0">El usuario que buscas no existe o no esta disponible.</p>
        </div>
      </div>
    </div>
  </main>

  <div th:replace="~{fragments/footer :: pie}"></div>

</body>
</html>
