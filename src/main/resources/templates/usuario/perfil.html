<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.2/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="/styles/colors.css">
  <title>Mi Perfil</title>
  <style>
    .profile-card {
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }
    .profile-card:hover {
      transform: translateY(-3px);
      background-color: rgba(255, 255, 255, 0.08);
    }
  </style>
</head>
<body class="bg-brand-dark text-white min-vh-100 d-flex flex-column">

  <nav th:replace="~{fragments/navbar :: navbar-nofixed}"></nav>

  <main th:if="${usuario}" class="container py-5 flex-grow-1">
    <div class="row justify-content-center">
      <div class="col-12 col-lg-10">
        
        <header class="mb-5 pb-4 border-bottom border-secondary border-opacity-25">
          <div class="d-flex flex-column flex-md-row justify-content-between align-items-md-center gap-4">
            <div>
              <h1 class="display-4 fw-bold text-brand-light mb-2">
                <span th:text="${usuario.nombre}"></span> 
                <span th:text="${usuario.apellidos}"></span>
              </h1>
              <div class="text-white-50 d-flex align-items-center gap-2">
                <i class="bi bi-envelope-fill"></i>
                <span th:text="${usuario.email}"></span>
              </div>
            </div>
            <div>
              <a href="/academia/create" class="btn bg-brand-light text-dark fw-semibold px-4 py-2">
                <i class="bi bi-plus-circle-fill me-2"></i>Crear academia
              </a>
            </div>
          </div>
        </header>

        <section class="mb-5">
          <h2 class="h3 fw-semibold mb-4 d-flex align-items-center gap-2">
            <i class="bi bi-mortarboard-fill text-brand-light"></i> Mis Academias
          </h2>
          
          <div th:if="${academias.get('director') == null && academias.get('alumno') == null && academias.get('profesor') == null}" class="p-4 rounded border border-secondary border-opacity-25 text-center" style="background-color: rgba(255,255,255,0.05);">
            <p class="text-white-50 mb-0">No formas parte de ninguna academia todavia.</p>
          </div>

          <div class="row g-3">
            
            <div th:if="${academias.get('director')}" th:each="academia : ${academias.get('director')}" class="col-12 col-md-6 col-lg-4">
              <div class="profile-card h-100 p-3 rounded border border-secondary border-opacity-25 position-relative" style="background-color: rgba(255,255,255,0.05);">
                <h5 class="fw-semibold mb-2">
                  <a th:href="@{/academias/{id}(id=${academia.id})}" class="text-white text-decoration-none stretched-link" th:text="${academia.nombre}"></a>
                </h5>
                <span class="badge bg-success align-self-start">Director</span>
              </div>
            </div>

            <div th:if="${academias.get('alumno')}" th:each="academia : ${academias.get('alumno')}" class="col-12 col-md-6 col-lg-4">
              <div class="profile-card h-100 p-3 rounded border border-secondary border-opacity-25 position-relative" style="background-color: rgba(255,255,255,0.05);">
                <h5 class="fw-semibold mb-2">
                  <a th:href="@{/academias/{id}(id=${academia.id})}" class="text-white text-decoration-none stretched-link" th:text="${academia.nombre}"></a>
                </h5>
                <span class="badge bg-info text-dark align-self-start">Alumno</span>
              </div>
            </div>

            <div th:if="${academias.get('profesor')}" th:each="academia : ${academias.get('profesor')}" class="col-12 col-md-6 col-lg-4">
              <div class="profile-card h-100 p-3 rounded border border-secondary border-opacity-25 position-relative" style="background-color: rgba(255,255,255,0.05);">
                <h5 class="fw-semibold mb-2">
                  <a th:href="@{/academias/{id}(id=${academia.id})}" class="text-white text-decoration-none stretched-link" th:text="${academia.nombre}"></a>
                </h5>
                <span class="badge bg-warning text-dark align-self-start">Profesor</span>
              </div>
            </div>

          </div>
        </section>

        <section>
          <h2 class="h3 fw-semibold mb-4 d-flex align-items-center gap-2">
            <i class="bi bi-briefcase-fill text-brand-light"></i> Candidaturas Activas
          </h2>
          
          <div th:if="${#sets.size(ofertasAplicadas) == 0}" class="p-4 rounded border border-secondary border-opacity-25 text-center" style="background-color: rgba(255,255,255,0.05);">
            <i class="bi bi-info-circle d-block fs-3 text-white-50 mb-2"></i>
            <span class="text-white-50">No has aplicado a ninguna oferta todavia.</span>
          </div>

          <div th:if="${#sets.size(ofertasAplicadas) > 0}" class="row g-3">
            <div class="col-12 col-md-6" th:each="oferta : ${ofertasAplicadas}">
              <a th:href="@{/ofertas/{id}(id=${oferta.id})}" class="text-decoration-none">
                <div class="profile-card p-3 rounded border border-secondary border-opacity-25 d-flex justify-content-between align-items-center" style="background-color: rgba(255,255,255,0.05);">
                  <div>
                    <h5 class="fw-semibold mb-1 text-white" th:text="${oferta.titulo}"></h5>
                    <span class="text-white-50 small d-flex align-items-center gap-1">
                      <i class="bi bi-building"></i> <span th:text="${oferta.academia.nombre}"></span>
                    </span>
                  </div>
                  <span class="badge bg-brand-light text-dark">En proceso</span>
                </div>
              </a>
            </div>
          </div>
        </section>

      </div>
    </div>
  </main>

  <main th:unless="${usuario}" class="container py-5 text-center flex-grow-1">
    <div class="row justify-content-center">
      <div class="col-md-6">
        <div class="p-5 rounded border border-warning border-opacity-50 text-center" style="background-color: rgba(255,193,7,0.1);">
          <i class="bi bi-exclamation-triangle-fill text-warning display-3 d-block mb-3"></i>
          <h4 class="fw-bold text-warning">Usuario no encontrado</h4>
          <p class="text-white-50 mb-0">El usuario que buscas no existe o no esta disponible.</p>
        </div>
      </div>
    </div>
  </main>

  <div th:replace="~{fragments/footer :: pie}"></div>

</body>
</html>
