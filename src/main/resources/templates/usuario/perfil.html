<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.2/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="/styles/colors.css">
  <title>Mi Perfil</title>
</head>
<body class="bg-light">

  <div class="border-bottom bg-white shadow-sm">
    <div th:replace="~{fragments/navbar :: navbar-black-nofixed}"></div>
  </div>

  <main th:if="${usuario}" class="container my-5">
    <div class="row justify-content-center">
      <div class="col-12 col-lg-10">
        
        <div class="card bg-brand text-white shadow-lg border-0 rounded-4 overflow-hidden mb-4">
          <div class="card-body p-4 p-md-5">
            
            <header class="d-flex flex-column flex-md-row justify-content-between align-items-md-center gap-3 border-bottom border-white border-opacity-10 pb-4 mb-4">
              <div>
                <h1 class="display-5 fw-bold mb-2">
                  <span th:text="${usuario.nombre}"></span> 
                  <span th:text="${usuario.apellidos}"></span>
                </h1>
                <div class="text-white-50 d-flex align-items-center gap-2">
                  <i class="bi bi-envelope-fill"></i>
                  <span th:text="${usuario.email}"></span>
                </div>
              </div>
              <div>
                <a href="/academia/create" class="btn btn-light btn-lg fw-semibold shadow-sm px-4">
                  <i class="bi bi-plus-circle-fill me-2"></i>Crear una academia
                </a>
              </div>
            </header>

            <section class="mb-5">
              <h3 class="h4 fw-bold mb-4 d-flex align-items-center gap-2">
                <i class="bi bi-mortarboard-fill"></i> Mis Academias
              </h3>
              
              <div class="row g-3">
                
                <div th:if="${academias.get('director')}" th:each="academia : ${academias.get('director')}" class="col-12 col-md-6 col-lg-4">
                  <div class="card bg-white bg-opacity-10 border border-white border-opacity-20 text-white h-100 rounded-3 custom-card-hover position-relative">
                    <div class="card-body d-flex flex-column justify-content-between p-3">
                      <h5 class="card-title fw-semibold mb-3">
                        <a th:href="@{/academias/{id}(id=${academia.id})}" class="text-white text-decoration-none stretched-link" th:text="${academia.nombre}"></a>
                      </h5>
                      <span class="badge bg-success bg-opacity-75 text-white align-self-start px-2 py-1.5 fs-7">Director</span>
                    </div>
                  </div>
                </div>

                <div th:if="${academias.get('alumno')}" th:each="academia : ${academias.get('alumno')}" class="col-12 col-md-6 col-lg-4">
                  <div class="card bg-white bg-opacity-10 border border-white border-opacity-20 text-white h-100 rounded-3 custom-card-hover position-relative">
                    <div class="card-body d-flex flex-column justify-content-between p-3">
                      <h5 class="card-title fw-semibold mb-3">
                        <a th:href="@{/academias/{id}(id=${academia.id})}" class="text-white text-decoration-none stretched-link" th:text="${academia.nombre}"></a>
                      </h5>
                      <span class="badge bg-info text-dark align-self-start px-2 py-1.5 fs-7">Alumno</span>
                    </div>
                  </div>
                </div>

                <div th:if="${academias.get('profesor')}" th:each="academia : ${academias.get('profesor')}" class="col-12 col-md-6 col-lg-4">
                  <div class="card bg-white bg-opacity-10 border border-white border-opacity-20 text-white h-100 rounded-3 custom-card-hover position-relative">
                    <div class="card-body d-flex flex-column justify-content-between p-3">
                      <h5 class="card-title fw-semibold mb-3">
                        <a th:href="@{/academias/{id}(id=${academia.id})}" class="text-white text-decoration-none stretched-link" th:text="${academia.nombre}"></a>
                      </h5>
                      <span class="badge bg-warning text-dark align-self-start px-2 py-1.5 fs-7">Profesor</span>
                    </div>
                  </div>
                </div>

              </div>
            </section>
            <section>
              <h3 class="h4 fw-bold mb-4 d-flex align-items-center gap-2">
                <i class="bi bi-briefcase-fill"></i> Candidaturas Activas
              </h3>
              
              <div th:if="${#sets.size(ofertasAplicadas) == 0}" class="text-white-50 p-4 border border-dashed border-white border-opacity-25 rounded-3 text-center">
                <i class="bi bi-info-circle d-block fs-3 mb-2"></i>
                <span>No has aplicado a ninguna oferta todavía.</span>
              </div>

              <div th:if="${#sets.size(ofertasAplicadas) > 0}" class="list-group list-group-flush rounded-3 overflow-hidden border border-white border-opacity-10">
                <a th:href="@{/ofertas/{id}(id=${oferta.id})}" th:each="oferta : ${ofertasAplicadas}" class="list-group-item bg-white bg-opacity-5 text-white border-bottom border-white border-opacity-10 p-3 d-flex justify-content-between align-items-center">
                  <div>
                    <h5 class="mb-1 fw-semibold fs-6 text-black" th:text="${oferta.titulo}"></h5>
                    <span class="text-black-50 small d-flex align-items-center gap-1">
                      <i class="bi bi-building fs-7"></i> <span th:text="${oferta.academia.nombre}"></span>
                    </span>
                  </div>
                  <span class="badge rounded-pill bg-light text-dark fw-normal px-3 py-2">En proceso</span>
                </a>
              </div>
            </section>

          </div>
        </div>

      </div>
    </div>
  </main>

  <main th:unless="${usuario}" class="container my-5 text-center">
    <div class="row justify-content-center">
      <div class="col-md-6">
        <div class="alert alert-warning shadow-sm p-5 rounded-4" role="alert">
          <i class="bi bi-exclamation-triangle-fill text-warning display-4 d-block mb-3"></i>
          <h4 class="alert-heading fw-bold">¡Vaya!</h4>
          <p class="mb-0">El usuario que estás buscando no ha sido encontrado o no está disponible.</p>
        </div>
      </div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
