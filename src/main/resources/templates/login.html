<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="/styles/colors.css">
  <title>Login</title>
</head>
<body class="bg-brand-dark text-white d-flex flex-column min-vh-100">
  
  <nav th:replace="~{fragments/navbar :: navbar-nofixed}"></nav>
  
  <div class="container flex-grow-1 d-flex justify-content-center mt-5 pt-5">
    <div class="w-100 p-3" style="max-width: 22rem;">
      
      <h2 class="fw-bold mb-4 text-center">Iniciar Sesión</h2>

      <form class="d-flex flex-column gap-3" action="#" th:action="@{/login}" th:object="${usuario}" method="POST">
        
        <div>
          <label class="form-label small text-white-50">Usuario:</label>
          <input class="form-control bg-dark border-secondary text-white" type="text" name="username" required>
        </div>
        
        <div>
          <label class="form-label small text-white-50">Contraseña:</label>
          <input class="form-control bg-dark border-secondary text-white" type="password" name="password" required>
        </div>
        
        <button class="btn bg-brand text-white fw-semibold mt-2 py-2" type="submit">Entrar</button>
        
      </form>

    </div>
  </div>

  <div th:replace="~{fragments/footer :: pie}"></div>

</body>
</html>
