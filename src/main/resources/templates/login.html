<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.2/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="/styles/colors.css">
  <title>Iniciar sesion</title>
</head>
<body class="bg-brand-dark text-white d-flex flex-column min-vh-100">
  
  <nav th:replace="~{fragments/navbar :: navbar-nofixed}"></nav>
  
  <div class="container flex-grow-1 d-flex justify-content-center align-items-center py-5">
    <div class="w-100 p-4 rounded shadow-lg border border-secondary border-opacity-25" style="max-width: 26rem; background-color: rgba(255,255,255,0.05);">
      
      <h2 class="fw-bold mb-1 text-center">Iniciar Sesion</h2>
      <p class="text-white-50 text-center mb-4">Accede a tu cuenta de Academy Manager</p>

      <div th:if="${param.error}" class="alert alert-danger py-2 small">
        Usuario o contrasena incorrectos
      </div>

      <form class="d-flex flex-column gap-3" action="#" th:action="@{/login}" th:object="${usuario}" method="POST">
        
        <div>
          <label class="form-label small text-white-50">Usuario</label>
          <div class="input-group">
            <span class="input-group-text bg-dark border-secondary text-white-50"><i class="bi bi-person"></i></span>
            <input class="form-control bg-dark border-secondary text-white" type="text" name="username" placeholder="Tu nombre de usuario" required>
          </div>
        </div>
        
        <div>
          <label class="form-label small text-white-50">Contrasena</label>
          <div class="input-group">
            <span class="input-group-text bg-dark border-secondary text-white-50"><i class="bi bi-lock"></i></span>
            <input class="form-control bg-dark border-secondary text-white" type="password" name="password" placeholder="Tu contrasena" required>
          </div>
        </div>
        
        <button class="btn bg-brand text-white fw-semibold mt-2 py-2" type="submit">Entrar</button>
        
      </form>

      <p class="text-white-50 text-center mt-4 mb-0 small">
        No tienes cuenta? <a class="text-brand-light text-decoration-none" href="/registro">Registrate aqui</a>
      </p>

    </div>
  </div>

  <div th:replace="~{fragments/footer :: pie}"></div>

</body>
</html>
