<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  <link rel="stylesheet" href="/styles/colors.css">
  <title>Login</title>
</head>
<body class="bg-brand-dark text-white d-flex flex-column min-vh-100">
  <nav th:replace="~{fragments/navbar :: navbar-nofixed}"></nav>
  <div class="container-sm flex-grow-1 d-flex justify-content-center align-items-center">
    <form class="d-flex flex-column mx-auto w-100" action="#" style="max-width: 20rem;" th:action="@{/login}" th:object="${usuario}" method="POST">
      <div class="mb-3">
        <label class="form-label d-block">Usuario:</label>
        <input class="form-text w-100" type="text" name="username" required>
      </div>
      
      <div class="mb-3">
        <label class="form-label d-block">Contraseña:</label>
        <input class="form-text w-100" type="password" name="password" required>
      </div>
      
      <button class="bg-brand border-0 text-white rounded" type="submit">Iniciar Sesión</button>
    </form>
  </div>
</body>
</html>
