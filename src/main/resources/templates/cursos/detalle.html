<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.2/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="/styles/colors.css">
  <title th:text="${curso.nombre}">Curso</title>
  <style>
    .tab-link {
      color: rgba(255,255,255,0.6);
      text-decoration: none;
      padding: 0.5rem 1rem;
      border-bottom: 2px solid transparent;
      transition: color 0.2s, border-color 0.2s;
    }
    .tab-link:hover {
      color: white;
    }
    .tab-link.active {
      color: white;
      border-bottom-color: var(--brand-color-light);
    }
  </style>
</head>
<body class="bg-brand-dark text-white d-flex flex-column min-vh-100">
  <nav th:replace="~{fragments/navbar :: navbar-nofixed}"></nav>

  <header class="border-bottom border-secondary border-opacity-25">
    <div class="container">
      <nav class="d-flex gap-2">
        <a class="tab-link active" th:href="@{/academias/{academiaId}/cursos/{id}(academiaId=${curso.academia.id}, id=${curso.id})}">
          <i class="bi bi-info-circle"></i> Informacion
        </a>
        <a class="tab-link" th:href="@{/academias/{academiaId}/cursos/{id}/personas(academiaId=${curso.academia.id}, id=${curso.id})}">
          <i class="bi bi-people"></i> Personas
        </a>
      </nav>
    </div>
  </header>

  <main class="container py-5 flex-grow-1">
    <div class="d-flex flex-column flex-md-row justify-content-between gap-4 mb-5">
      <div>
        <a class="text-brand-light text-decoration-none small" th:href="@{/academias/{id}(id=${curso.academia.id})}">
          <i class="bi bi-arrow-left"></i> <span th:text="${curso.academia.nombre}">Academia</span>
        </a>
        <h1 class="display-5 fw-bold mb-2" th:text="${curso.nombre}">Nombre del curso</h1>
      </div>

      <div class="d-flex flex-column gap-2 align-self-start" th:if="${editable}">
        <div class="d-flex gap-2">
          <a class="btn btn-outline-light btn-sm" th:href="@{/academias/{academiaId}/cursos/{id}/editar(academiaId=${curso.academia.id}, id=${curso.id})}">Editar</a>
          <form action="#" method="post" th:action="@{/academias/{academiaId}/cursos/{id}/borrar(academiaId=${curso.academia.id}, id=${curso.id})}">
            <button id="boton-borrar" type="submit" class="btn btn-outline-danger btn-sm">Borrar</button>
          </form>
        </div>
      </div>
    </div>

    <div class="mb-4 d-flex flex-wrap gap-2">
      <span th:if="${curso.fechaInicio != null and curso.fechaFin != null}" class="badge bg-brand-light text-dark">
        <i class="bi bi-calendar3"></i>
        <span th:text="${#temporals.format(curso.fechaInicio, 'dd/MM/yyyy')}"></span>
        -
        <span th:text="${#temporals.format(curso.fechaFin, 'dd/MM/yyyy')}"></span>
      </span>
      <span class="badge bg-info text-dark">
        <i class="bi bi-people-fill"></i>
        <span th:text="${#sets.size(curso.alumnos)}">0</span>
        /
        <span th:text="${curso.cupoMaximo != null} ? ${curso.cupoMaximo} : '∞'">∞</span>
        alumnos
        <span th:if="${plazasDisponibles > 0 and plazasDisponibles < 2147483647}" th:text="'(' + ${plazasDisponibles} + ' libres)'">(0 libres)</span>
        <span th:if="${plazasDisponibles == 0}">(completo)</span>
      </span>
    </div>

    <section class="mb-5">
      <h2 class="h4 fw-semibold mb-3">Descripcion</h2>
      <div th:if="${curso.descripcion}" class="p-4 rounded border border-secondary border-opacity-25" style="background-color: rgba(255,255,255,0.05);">
        <p class="lead mb-0" th:text="${curso.descripcion}">Descripcion del curso...</p>
      </div>
      <p th:unless="${curso.descripcion}" class="text-white-50">Este curso no tiene descripcion.</p>
    </section>
  </main>

  <div th:replace="~{fragments/footer :: pie}"></div>

  <script>
    const botonBorrar = document.getElementById('boton-borrar');
    if (botonBorrar) {
      botonBorrar.addEventListener('click', function(event) {
        if (!confirm('Estas seguro de que quieres borrar este curso?')) {
          event.preventDefault();
        }
      });
    }
  </script>
</body>
</html>
