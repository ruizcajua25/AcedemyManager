<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.2/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="/styles/colors.css">
  <title>Personas - <span th:text="${curso.nombre}">Curso</span></title>
  <style>
    .tab-link {
      color: rgba(255,255,255,0.6);
      text-decoration: none;
      padding: 0.5rem 1rem;
      border-bottom: 2px solid transparent;
      transition: color 0.2s, border-color 0.2s;
    }
    .tab-link:hover {
      color: white;
    }
    .tab-link.active {
      color: white;
      border-bottom-color: var(--brand-color-light);
    }
  </style>
</head>
<body class="bg-brand-dark text-white d-flex flex-column min-vh-100">
  <nav th:replace="~{fragments/navbar :: navbar-nofixed}"></nav>

  <header class="border-bottom border-secondary border-opacity-25">
    <div class="container">
      <nav class="d-flex gap-2">
        <a class="tab-link" th:href="@{/academias/{academiaId}/cursos/{id}(academiaId=${curso.academia.id}, id=${curso.id})}">
          <i class="bi bi-info-circle"></i> Informacion
        </a>
        <a class="tab-link active" th:href="@{/academias/{academiaId}/cursos/{id}/personas(academiaId=${curso.academia.id}, id=${curso.id})}">
          <i class="bi bi-people"></i> Personas
        </a>
      </nav>
    </div>
  </header>

  <main class="container py-5 flex-grow-1">
    <section class="mb-5">
      <div class="d-flex justify-content-between align-items-center mb-3">
        <h2 class="h4 fw-semibold mb-0"><i class="bi bi-person-workspace"></i> Profesores</h2>
        <a class="btn bg-brand text-white btn-sm" th:if="${editable}" th:href="@{/academias/{academiaId}/cursos/{id}/profesores/add(academiaId=${curso.academia.id}, id=${curso.id})}">
          <i class="bi bi-plus"></i> Anadir profesor
        </a>
      </div>

      <div th:if="${#sets.size(profesores) == 0}" class="p-4 rounded border border-secondary border-opacity-25 text-center" style="background-color: rgba(255,255,255,0.05);">
        <p class="text-white-50 mb-0">No hay profesores en este curso aun</p>
      </div>

      <div th:if="${#sets.size(profesores) > 0}" class="row g-3">
        <div class="col-12 col-md-6 col-lg-4" th:each="profesor : ${profesores}">
          <div class="d-flex justify-content-between align-items-center p-3 rounded border border-secondary border-opacity-25" style="background-color: rgba(255,255,255,0.05);">
            <span th:text="${profesor.usuario.nombre}">Nombre</span>
            <form th:if="${editable}" action="#" method="post" th:action="@{/academias/{academiaId}/cursos/{id}/profesores/{profesorId}/eliminar(academiaId=${curso.academia.id}, id=${curso.id}, profesorId=${profesor.usuario.id})}">
              <button class="btn btn-outline-danger btn-sm">Eliminar</button>
            </form>
          </div>
        </div>
      </div>
    </section>

    <section>
      <div class="d-flex justify-content-between align-items-center mb-3">
        <h2 class="h4 fw-semibold mb-0"><i class="bi bi-mortarboard"></i> Alumnos</h2>
        <a class="btn bg-brand text-white btn-sm" th:if="${editable}" th:href="@{/academias/{academiaId}/cursos/{id}/alumnos/add(academiaId=${curso.academia.id}, id=${curso.id})}">
          <i class="bi bi-plus"></i> Anadir alumno
        </a>
      </div>

      <div th:if="${#sets.size(alumnos) == 0}" class="p-4 rounded border border-secondary border-opacity-25 text-center" style="background-color: rgba(255,255,255,0.05);">
        <p class="text-white-50 mb-0">No hay alumnos en este curso aun</p>
      </div>

      <div th:if="${#sets.size(alumnos) > 0}" class="row g-3">
        <div class="col-12 col-md-6 col-lg-4" th:each="alumno : ${alumnos}">
          <div class="d-flex justify-content-between align-items-center p-3 rounded border border-secondary border-opacity-25" style="background-color: rgba(255,255,255,0.05);">
            <span th:text="${alumno.usuario.nombre}">Nombre</span>
            <form th:if="${editable}" action="#" method="post" th:action="@{/academias/{academiaId}/cursos/{id}/alumnos/{alumnoId}/eliminar(academiaId=${curso.academia.id}, id=${curso.id}, alumnoId=${alumno.usuario.id})}">
              <button class="btn btn-outline-danger btn-sm">Eliminar</button>
            </form>
          </div>
        </div>
      </div>
    </section>
  </main>

  <div th:replace="~{fragments/footer :: pie}"></div>
</body>
</html>
