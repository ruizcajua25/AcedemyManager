<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  <link rel="stylesheet" href="/styles/colors.css">
  <title>Personas de la clase</title>
</head>
<body class="bg-brand-dark">
  <nav th:replace="~{fragments/navbar :: navbar-nofixed}"></nav>
  <header class="mt-3 text-white">
    <nav class="navbar d-flex justify-content-center gap-4">
      <a class="nav-link" th:href="@{/academias/{academiaId}/cursos/{id}(academiaId=${curso.academia.id}, id=${curso.id})}">Información</a>
      <a class="nav-link" th:href="@{/academias/{academiaId}/cursos/{id}/personas(academiaId=${curso.academia.id}, id=${curso.id})}">Personas</a>
    </nav>
  </header>
  <main class="px-5 py-3 text-white">
    <div>
      <h3 class="text-brand-light">Profesores</h3>
    </div>
    <ul>
      <span th:if="${#sets.size(profesores) == 0}">No hay profesores en este curso aun</span>
      <table th:if="${#sets.size(profesores) > 0}" class="table table-dark table-bordered">
        <tr th:each="profesor : ${profesores}">
          <td th:text="${profesor.usuario.nombre}"></td>
        </tr>
      </table>
    </ul>
    <form class="d-flex gap-2 mb-5" method="post" th:if="${editable}" th:action="@{/academias/{academiaId}/cursos/{id}/profesores/add(academiaId=${curso.academia.id}, id=${curso.id})}">
      <select class="form-select w-auto" name="profesorId" required>
        <option value="">Selecciona un profesor</option>
        <option th:each="profesor : ${profesoresDisponibles}" th:value="${profesor.usuario.id}" th:text="${profesor.usuario.nombre}"></option>
      </select>
      <button class="btn bg-brand text-white" type="submit">Añadir profesor</button>
    </form>

    <h3 class="text-brand-light">Alumnos</h3>
    <ul>
      <span th:if="${#sets.size(alumnos) == 0}">No hay alumnos en este curso aun</span>
      <table th:if="${#sets.size(alumnos) > 0}" class="table table-dark table-bordered">
        <tr th:each="alumno : ${alumnos}">
          <td th:text="${alumno.usuario.nombre}"></td>
        </tr>
      </table>
    </ul>
    <form class="d-flex gap-2" method="post" th:if="${editable}" th:action="@{/academias/{academiaId}/cursos/{id}/alumnos/add(academiaId=${curso.academia.id}, id=${curso.id})}">
      <select class="form-select w-auto" name="alumnoId" required>
        <option value="">Selecciona un alumno</option>
        <option th:each="alumno : ${alumnosDisponibles}" th:value="${alumno.usuario.id}" th:text="${alumno.usuario.nombre}"></option>
      </select>
      <button class="btn bg-brand text-white" type="submit">Añadir alumno</button>
    </form>
  </main>
</body>
</html>
