<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  <link rel="stylesheet" href="/styles/colors.css">
  <title>Editar curso</title>
  <style>
    input::placeholder,
    textarea::placeholder {
      color: #aaa !important;
      opacity: 1;
    }
    .form-control:user-invalid {
      border-color: #dc3545;
      box-shadow: 0 0 0 0.25rem rgba(220, 53, 69, 0.15);
    }
    .form-control:user-invalid ~ .invalid-feedback {
      display: block;
    }
  </style>
</head>
<body class="bg-brand-dark text-white d-flex flex-column min-vh-100">
  <nav th:replace="~{fragments/navbar :: navbar-nofixed}"></nav>

  <main class="container flex-grow-1 d-flex align-items-center py-5">
    <div class="row w-100 justify-content-center">
      <div class="col-12 col-lg-10 col-xl-8">
        <div class="row align-items-center">
          <div class="col-12 col-md-5 mb-4 mb-md-0">
            <h1 class="text-brand-light text-uppercase fw-semibold display-4">
              Editar
              <span class="d-block">curso</span>
            </h1>
            <p class="lead text-white-50 mt-3">Modifica los datos del curso.</p>
          </div>
          <div class="col-12 col-md-7">
            <form class="d-flex flex-column bg-white gap-3 p-4 rounded shadow-lg text-dark" action="#" th:action="@{/academias/{academiaId}/cursos/{id}/editar(academiaId=${curso.academia.id}, id=${curso.id})}" th:object="${curso}" method="post">
              
              <div>
                <label class="form-label small fw-semibold" for="nombre">*Nombre del curso</label>
                <input class="form-control" type="text" id="nombre" name="nombre" th:field="*{nombre}" 
                       required minlength="3" maxlength="100"
                       placeholder="Nombre del curso">
                <div class="invalid-feedback">El nombre es obligatorio (minimo 3 caracteres).</div>
              </div>

              <div>
                <label class="form-label small fw-semibold" for="descripcion">Descripcion</label>
                <textarea class="form-control" id="descripcion" name="descripcion" th:field="*{descripcion}" 
                          rows="3" minlength="10" maxlength="500" 
                          placeholder="Descripcion del curso..."></textarea>
                <div class="invalid-feedback">Si añades descripcion, debe tener al menos 10 caracteres.</div>
              </div>

              <div class="row g-3">
                <div class="col-12 col-sm-6">
                  <label class="form-label small fw-semibold" for="fechaInicio">*Fecha de inicio</label>
                  <input class="form-control" type="date" id="fechaInicio" name="fechaInicio" th:field="*{fechaInicio}" required>
                </div>
                <div class="col-12 col-sm-6">
                  <label class="form-label small fw-semibold" for="fechaFin">*Fecha de fin</label>
                  <input class="form-control" type="date" id="fechaFin" name="fechaFin" th:field="*{fechaFin}" required>
                </div>
              </div>

              <div>
                <label class="form-label small fw-semibold" for="cupoMaximo">Cupo maximo</label>
                <input class="form-control" type="number" id="cupoMaximo" name="cupoMaximo" th:field="*{cupoMaximo}"
                       min="1" placeholder="Dejalo vacio si no hay limite">
                <div class="form-text text-secondary">Numero maximo de alumnos. Dejalo vacio para no limitar.</div>
              </div>

              <div class="d-flex gap-2 mt-2">
                <button class="btn bg-brand text-white fw-semibold" type="submit">Guardar cambios</button>
                <a class="btn btn-outline-secondary" th:href="@{/academias/{academiaId}/cursos/{id}(academiaId=${curso.academia.id}, id=${curso.id})}">Cancelar</a>
              </div>
            </form>
          </div>
        </div>
      </div>
    </div>
  </main>

  <div th:replace="~{fragments/footer :: pie}"></div>
</body>
</html>
