<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  <link rel="stylesheet" href="/styles/colors.css">
  <title>Anadir alumnos</title>
</head>
<body class="bg-brand-dark">
  <nav th:replace="~{fragments/navbar :: navbar-nofixed}"></nav>
  <main class="container py-5">
    <form class="d-flex flex-column bg-white gap-3 border p-4 rounded shadow-lg text-dark" method="post" th:action="@{/academias/{academiaId}/cursos/{id}/alumnos/add(academiaId=${curso.academia.id}, id=${curso.id})}">
      <h1 class="h3">Anadir alumnos</h1>

      <span th:if="${#lists.size(alumnosDisponibles) == 0}">No hay alumnos disponibles para anadir</span>

      <div class="form-check" th:each="alumno : ${alumnosDisponibles}">
        <input class="form-check-input" type="checkbox" name="alumnoId" th:id="${alumno.usuario.id}" th:value="${alumno.usuario.id}">
        <label class="form-check-label" th:for="${alumno.usuario.id}" th:text="${alumno.usuario.nombre}"></label>
      </div>

      <div class="d-flex gap-2">
        <button class="btn bg-brand text-white" type="submit" th:if="${#lists.size(alumnosDisponibles) > 0}">Anadir alumnos</button>
        <a class="btn btn-secondary" th:href="@{/academias/{academiaId}/cursos/{id}/personas(academiaId=${curso.academia.id}, id=${curso.id})}">Volver</a>
      </div>
    </form>
  </main>
</body>
</html>
