<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.2/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="/styles/colors.css">
  <title>Anadir alumnos</title>
</head>
<body class="bg-brand-dark text-white d-flex flex-column min-vh-100">
  <nav th:replace="~{fragments/navbar :: navbar-nofixed}"></nav>

  <main class="container flex-grow-1 d-flex align-items-center py-5">
    <div class="row w-100 justify-content-center">
      <div class="col-12 col-lg-10 col-xl-8">
        <div class="row align-items-center">
          <div class="col-12 col-md-5 mb-4 mb-md-0">
            <h1 class="text-brand-light text-uppercase fw-semibold display-4">
              Anadir
              <span class="d-block">alumnos</span>
            </h1>
            <p class="lead text-white-50 mt-3">Selecciona los alumnos que quieres añadir al curso.</p>
          </div>
          <div class="col-12 col-md-7">
            <form class="d-flex flex-column bg-white gap-3 p-4 rounded shadow-lg text-dark" method="post" th:action="@{/academias/{academiaId}/cursos/{id}/alumnos/add(academiaId=${curso.academia.id}, id=${curso.id})}">

              <div th:if="${#lists.size(alumnosDisponibles) == 0}" class="alert alert-secondary mb-0">
                <i class="bi bi-info-circle me-2"></i>No hay alumnos disponibles para añadir
              </div>

              <div class="form-check p-3 rounded border" th:each="alumno : ${alumnosDisponibles}">
                <input class="form-check-input" type="checkbox" name="alumnoId" th:id="${alumno.usuario.id}" th:value="${alumno.usuario.id}">
                <label class="form-check-label fw-semibold" th:for="${alumno.usuario.id}" th:text="${alumno.usuario.nombre}"></label>
              </div>

              <div class="d-flex gap-2 mt-2" th:if="${#lists.size(alumnosDisponibles) > 0}">
                <button class="btn bg-brand text-white fw-semibold" type="submit">Anadir alumnos</button>
                <a class="btn btn-outline-secondary" th:href="@{/academias/{academiaId}/cursos/{id}/personas(academiaId=${curso.academia.id}, id=${curso.id})}">Cancelar</a>
              </div>
              <div th:if="${#lists.size(alumnosDisponibles) == 0}">
                <a class="btn btn-outline-secondary" th:href="@{/academias/{academiaId}/cursos/{id}/personas(academiaId=${curso.academia.id}, id=${curso.id})}">Volver</a>
              </div>
            </form>
          </div>
        </div>
      </div>
    </div>
  </main>

  <div th:replace="~{fragments/footer :: pie}"></div>
</body>
</html>
