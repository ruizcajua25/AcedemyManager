<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  <link rel="stylesheet" href="/styles/colors.css">
  <title>Document</title>
</head>
<body style="height: 100vh; display: grid; place-content: center;">
  <div class="container-sm border p-4 rounded" style="max-width: 40rem;">
    <h1 class="text-center mb-5 text-brand display-2">Crea tu academia</h1>
    <form class="d-flex flex-column gap-4" action="#" >
      <div>
      <label class="form-label" for="nombre">Nombre de la academia:</label>
      <input class="form-control" type="text" id="nombre" name="nombre">
      </div>
      <div>
        <label class="form-label" for="direccion">Dirección:</label>
        <input class="form-control" type="text" id="direccion" name="direccion">
      </div>
      <div>
        <label class="form-label" for="telefono">Teléfono:</label>
        <input class="form-control" type="text" id="telefono" name="telefono">
      </div>
    </form>
  </div>
</body>
</html>
