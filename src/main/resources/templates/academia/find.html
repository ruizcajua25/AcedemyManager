<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  <link rel="stylesheet" href="/styles/colors.css">
  <title>Lista de academias</title>
  <style>
    .academia-card {
      transition: transform .2s ease, box-shadow .2s ease;
    }

    .academia-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 1rem 2rem rgba(0, 0, 0, .18) !important;
    }
  </style>
  <script defer>
    document.addEventListener('DOMContentLoaded', () => {
      const searchInput = document.getElementById('searchInput');
      const academias = document.querySelectorAll('.academia');

      searchInput.addEventListener('input', () => {
        const filter = searchInput.value.toLowerCase();

        academias.forEach(academia => {
          const text = academia.textContent.toLowerCase();
          if (text.includes(filter)) {
            academia.style.display = '';
          } else {
            academia.style.display = 'none';
          }
        });
      });
    });
  </script>
</head>
<body class="bg-brand-dark text-white min-vh-100">
  <div th:replace="~{fragments/navbar :: navbar-nofixed}"></div>

  <main class="container py-5">
    <header class="d-flex flex-column flex-md-row justify-content-between gap-4 align-items-md-end mb-4">
      <div>
        <h1 class="display-5 fw-bold mb-2">Buscar academia</h1>
        <p class="lead text-white-50 mb-0">Encuentra academias y consulta sus cursos y ofertas.</p>
      </div>
      <a class="btn bg-brand-light text-dark fw-semibold px-4" href="/academia/create">Crear academia</a>
    </header>

    <input class="form-control form-control-lg mb-4" type="text" placeholder="Buscar academia..." id="searchInput">

    <div th:if="${#lists.size(academias) == 0}" class="bg-white text-dark rounded shadow p-5 text-center">
      <h2 class="h3 fw-bold mb-3">No hay academias disponibles</h2>
      <p class="text-secondary mb-0">Cuando se cree una academia, aparecera aqui.</p>
    </div>

    <section th:if="${#lists.size(academias) > 0}" class="row g-4">
      <div class="academia col-12 col-md-6 col-xl-4" th:each="academia : ${academias}">
        <a class="text-decoration-none" th:href="@{/academias/{id}(id=${academia.id})}">
          <article class="academia-card bg-white text-dark rounded shadow-sm p-4 h-100">
            <h2 class="h4 fw-bold text-truncate mb-2" th:text="${academia.nombre}">Academia sin nombre</h2>
            <p class="text-secondary mb-3" th:if="${academia.descripcion}" th:text="${academia.descripcion}">Descripcion</p>
            <p class="text-secondary mb-3" th:unless="${academia.descripcion}" th:text="${academia.direccion}">Direccion</p>

            <ul class="list-unstyled d-flex justify-content-between border-top pt-3 mb-0 small text-secondary">
              <li class="text-center">
                <strong class="d-block fs-5 text-dark" th:text="${#sets.size(academia.alumnos)}">0</strong>
                alumnos
              </li>
              <li class="text-center">
                <strong class="d-block fs-5 text-dark" th:text="${#sets.size(academia.profesores)}">0</strong>
                profesores
              </li>
              <li class="text-center">
                <strong class="d-block fs-5 text-dark" th:text="${#sets.size(academia.directores)}">0</strong>
                directores
              </li>
            </ul>
          </article>
        </a>
      </div>
    </section>
  </main>
  <div th:replace="~{fragments/footer :: pie}"></div>
</body>
</html>
