<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.2/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="/styles/colors.css">
  <title>Mis Academias - Panel</title>
  <style>
    .academy-card {
      transition: transform 0.2s ease, box-shadow 0.2s ease;
      background-color: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
    }
    .academy-card:hover {
      transform: translateY(-3px);
      background-color: rgba(255, 255, 255, 0.08);
      border-color: rgba(255, 255, 255, 0.2);
    }
  </style>
</head>
<body class="bg-brand-dark text-white d-flex flex-column min-vh-100">
  <nav th:replace="~{fragments/navbar :: navbar-nofixed}"></nav>

  <main class="container py-5 flex-grow-1">
    <header class="d-flex flex-column flex-md-row justify-content-between align-items-md-end gap-3 mb-5">
      <div>
        <a class="text-brand-light text-decoration-none small" href="/panel">
          <i class="bi bi-arrow-left"></i> Volver al panel
        </a>
        <h1 class="display-5 fw-bold mb-2 mt-2">Mis Academias</h1>
        <p class="lead text-white-50 mb-0">Gestiona las academias que diriges</p>
      </div>
      <a class="btn bg-brand-light text-dark px-4" href="/academia/create">
        <i class="bi bi-plus-circle me-2"></i>Nueva academia
      </a>
    </header>

    <div th:if="${#lists.size(academias) == 0}" class="bg-white text-dark rounded shadow p-5 text-center">
      <i class="bi bi-building display-1 text-secondary mb-3"></i>
      <h2 class="h3 fw-bold mb-3">No eres director de ninguna academia</h2>
      <p class="text-secondary mb-4">Crea una academia para empezar a gestionarla.</p>
      <a class="btn bg-brand text-white px-4" href="/academia/create">Crear academia</a>
    </div>

    <section th:if="${#lists.size(academias) > 0}" class="row g-4">
      <div class="col-12 col-md-6 col-xl-4" th:each="academia : ${academias}">
        <div class="academy-card rounded-3 p-4 h-100">
          <div class="d-flex justify-content-between align-items-start mb-3">
            <h2 class="h5 fw-bold mb-0 text-truncate" th:text="${academia.nombre}">Academia</h2>
            <span class="badge bg-brand-light text-dark">Director</span>
          </div>

          <p class="text-white-50 small mb-3" th:text="${academia.direccion}">Direccion</p>

          <ul class="list-unstyled d-flex justify-content-between border-top border-secondary border-opacity-25 pt-3 mb-3 small text-white-50">
            <li class="text-center">
              <strong class="d-block fs-5 text-white" th:text="${#sets.size(academia.alumnos)}">0</strong>
              alumnos
            </li>
            <li class="text-center">
              <strong class="d-block fs-5 text-white" th:text="${#sets.size(academia.profesores)}">0</strong>
              profesores
            </li>
            <li class="text-center">
              <strong class="d-block fs-5 text-white" th:text="${#sets.size(academia.cursos)}">0</strong>
              cursos
            </li>
          </ul>

          <div class="d-flex flex-wrap gap-2">
            <a class="btn btn-sm btn-outline-light flex-grow-1" th:href="@{/academias/{id}(id=${academia.id})}" title="Ver academia">
              <i class="bi bi-eye me-1"></i>Ver
            </a>
            <a class="btn btn-sm btn-outline-light" th:href="@{/academias/{id}/editar(id=${academia.id})}" title="Editar academia">
              <i class="bi bi-pencil"></i>
            </a>
            <a class="btn btn-sm btn-outline-light" th:href="@{/academias/{academiaId}/cursos/crear(academiaId=${academia.id})}" title="Crear curso">
              <i class="bi bi-book"></i>
            </a>
            <a class="btn btn-sm btn-outline-light" th:href="@{/ofertas/crear?academiaId={id}(id=${academia.id})}" title="Crear oferta">
              <i class="bi bi-briefcase"></i>
            </a>
          </div>
        </div>
      </div>
    </section>
  </main>

  <div th:replace="~{fragments/footer :: pie}"></div>
</body>
</html>
